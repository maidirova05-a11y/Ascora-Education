# ASCORA Education целиком на своём сервере: сайт + API + собственная база.
# Запасной вариант на случай, если Vercel/Forge или Neon недоступны — см. BACKUP.md.
#
#   cp docker.env.example docker.env   # и заполнить
#   docker compose up -d --build
#
# Сайт слушает только 127.0.0.1:3104 — наружу его отдаёт Caddy/nginx с HTTPS.
# DATABASE_URL здесь намеренно не берётся из окружения: контейнер всегда
# работает со своей базой и не может случайно подключиться к боевой.

name: ascora

services:
  db:
    image: postgres:${POSTGRES_MAJOR:-17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Таблицы сервер создаёт сам при старте.
  app:
    build: .
    image: ascora-app
    restart: unless-stopped
    env_file: docker.env
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      # Перед сайтом один прокси (Caddy/nginx), а не цепочка Vercel → nginx.
      TRUST_PROXY: "1"
      CLIENT_URL: ${SITE_URL:-https://www.ascora.education}
    ports:
      - "127.0.0.1:${APP_PORT:-3104}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
