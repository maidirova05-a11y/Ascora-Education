services:
  - type: web
    name: ascora-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      # Render puts exactly one proxy in front of the app; the server's default
      # (2 hops, for Vercel → Forge nginx) would let a client pick its own IP
      # via X-Forwarded-For and dodge the rate limits.
      - key: TRUST_PROXY
        value: "1"
